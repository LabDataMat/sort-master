<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>收纳大作战 Sort Master - 浏览器预览</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23F59E42'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./preview.css">
</head>
<body>
  <div id="scale-wrap"><div id="app"></div></div>
  <script type="module" src="./build/preview-main.js"></script>
  <script>
    // 750x1334 设计基准等比缩放
    function fit() {
      var s = Math.min(window.innerWidth / 750, window.innerHeight / 1334);
      document.getElementById('app').style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
